<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHAR - Local ZIP AR Viewer</title>
    
    <!-- Library Utama Open-Source -->
    <script type="module" src="https://googleapis.com"></script>
    <!-- Library untuk Ekstrak ZIP secara Offline -->
    <script src="https://cloudflare.com"></script>

    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; background-color: #f5f5f5; }
        h1 { color: #333; margin-bottom: 5px; }
        .input-container { width: 100%; max-width: 500px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; align-items: center;}
        
        /* Gaya tombol upload agar rapi */
        input[type="file"] {
            padding: 10px;
            border: 2px dashed #007bff;
            border-radius: 5px;
            background-color: #fff;
            width: 100%;
            box-sizing: border-box;
            cursor: pointer;
        }
        #status { margin-bottom: 10px; color: #666; font-size: 14px; text-align: center; font-weight: bold; }
        model-viewer { width: 100%; max-width: 500px; height: 400px; background-color: #e0e0e0; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <h1>SHAR Application</h1>
    <p style="color: #666; margin-top: 0;">Pilih file .ZIP dari memori internal HP atau komputer</p>

    <div class="input-container">
        <!-- Input File Lokal -->
        <input type="file" id="filePicker" accept=".zip" onchange="processLocalZip()">
    </div>
    
    <div id="status">Silakan pilih file .zip model 3D Anda...</div>

    <model-viewer 
        id="sharViewer" 
        src="" 
        ar 
        ar-modes="scene-viewer quick-look" 
        camera-controls 
        touch-action="pan-y" 
        shadow-intensity="1"
        autoplay
        alt="Pratinjau Model 3D SHAR">
    </model-viewer>

    <script>
        async function processLocalZip() {
            const fileInput = document.getElementById('filePicker');
            const viewer = document.getElementById('sharViewer');
            const statusDiv = document.getElementById('status');
            
            // Memastikan user sudah memilih file
            if (fileInput.files.length === 0) return;
            
            const selectedFile = fileInput.files[0];
            
            try {
                statusDiv.style.color = "#666";
                statusDiv.innerText = "Membaca file ZIP lokal...";
                
                // 1. Ekstrak file ZIP lokal menggunakan JSZip
                const zip = await JSZip.loadAsync(selectedFile);
                
                let modelFile = null;
                
                // Mencari file model utama di dalam ZIP (.gltf atau .glb)
                zip.forEach((relativePath, file) => {
                    if (relativePath.endsWith('.gltf') || relativePath.endsWith('.glb')) {
                        modelFile = file;
                    }
                });
                
                if (!modelFile) { 
                    throw new Error("Tidak ditemukan file model .gltf atau .glb di dalam ZIP!"); 
                }
                
                statusDiv.innerText = "Mengekstrak tekstur & material di memori...";
                
                // 2. Konversi file 3D utama menjadi Blob URL lokal agar bisa dimuat browser secara instan
                const modelBlob = await modelFile.async("blob");
                const modelUrl = URL.createObjectURL(modelBlob);
                
                statusDiv.style.color = "#28a745";
                statusDiv.innerText = "Sukses! Ketuk ikon AR di pojok kanan bawah objek untuk mengaktifkan kamera.";
                
                // Tampilkan model di layar
                viewer.setAttribute('src', modelUrl);
                
            } catch (error) {
                statusDiv.style.color = "#dc3545";
                statusDiv.innerText = "Error: " + error.message;
            }
        }
    </script>

</body>
</html>
